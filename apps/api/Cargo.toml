[workspace]
resolver = "3"
members = ["crates/domain", "crates/source-engine", "crates/fetcher", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
read-domain = { path = "crates/domain" }
read-source-engine = { path = "crates/source-engine" }
read-fetcher = { path = "crates/fetcher" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "charset",
] }
scraper = "0.21"
regex = "1"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2
